
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="570"
     viewBox="0 0 1200 570"
     role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#17152a"/>
    </linearGradient>

    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27213e"/>
      <stop offset="100%" stop-color="#10111f"/>
    </linearGradient>

    <linearGradient id="foil">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="22" height="22"
             patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1"
              fill="#ffffff" opacity=".06"/>
    </pattern>

    <clipPath id="portraitClip">
      <rect x="100" y="185" width="210" height="180" rx="12"/>
    </clipPath>

    <clipPath id="foilClip">
      <rect x="65" y="145" width="280" height="315" rx="20"/>
    </clipPath>

    <style>
      text {
        font-family: Arial, sans-serif;
      }

      .heading {
        fill: #f8fafc;
        font-weight: bold;
      }

      .muted {
        fill: #a1a1aa;
      }

      .enter {
        animation: enter 1s ease-out both;
      }

      .swing {
        transform-box: view-box;
        transform-origin: 205px 145px;
        animation: swing 4s ease-in-out infinite;
      }

      .float {
        animation: float 4s ease-in-out infinite;
      }

      .shine {
        animation: shine 4s ease-in-out infinite;
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      .bar {
        animation: bar 2s ease-in-out infinite alternate;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes swing {
        0%,100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }

      @keyframes float {
        50% { transform: translateY(-6px); }
      }

      @keyframes shine {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(300px); }
      }

      @keyframes pulse {
        50% { opacity: .4; }
      }

      @keyframes bar {
        from { opacity: .55; }
        to { opacity: 1; }
      }
    </style>
  </defs>

  <!-- BACKGROUND -->

  <rect width="1200" height="570" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="570" rx="26" fill="url(#dots)"/>

  <circle cx="210" cy="300" r="260" fill="url(#glow)"/>
  <circle cx="900" cy="280" r="300" fill="url(#glow)"/>

  <rect x="20" y="20" width="1160" height="530"
        rx="22" fill="none"
        stroke="url(#aurora)" stroke-opacity=".3"/>

  <!-- HEADER -->

  <g class="enter">
    <text x="55" y="62" fill="#22d3ee"
          font-size="12" letter-spacing="4">
      DEVELOPER IDENTITY
    </text>

    <text x="55" y="101" class="heading" font-size="30">
      My Developer Dashboard
    </text>

    <text x="1140" y="85" text-anchor="end"
          fill="#a78bfa" font-size="11"
          letter-spacing="2">
      BEHIND THE SCENES
    </text>
  </g>

  <!-- LEFT ID BADGE AREA -->

  <rect x="45" y="130" width="350" height="385"
        rx="20" fill="#111220"
        stroke="#a78bfa" stroke-opacity=".35"/>

  <text x="70" y="160" fill="#22d3ee"
        font-size="11" letter-spacing="2">
    01 / MY DIGITAL ID
  </text>

  <!-- LANYARD -->

  <g class="swing">

    <path d="M170 130 L170 170
             Q170 190 205 190
             Q240 190 240 170
             L240 130"
          fill="none" stroke="#a78bfa"
          stroke-width="13" stroke-linecap="round"/>

    <path d="M170 130 L170 170
             Q170 190 205 190
             Q240 190 240 170
             L240 130"
          fill="none" stroke="#22d3ee"
          stroke-width="2" stroke-opacity=".7"/>

    <!-- METAL CLASP -->

    <rect x="190" y="177" width="30" height="32"
          rx="6" fill="#71717a"
          stroke="#d4d4d8"/>

    <rect x="198" y="182" width="14" height="20"
          rx="4" fill="#27272a"/>

    <circle cx="205" cy="180" r="4" fill="#fbbf24"/>

    <!-- ID CARD -->

    <rect x="65" y="205" width="280" height="255"
          rx="20" fill="url(#badge)"
          stroke="url(#aurora)" stroke-width="2"/>

    <rect x="65" y="205" width="280" height="255"
          rx="20" fill="url(#dots)"/>

    <!-- TOP LABEL -->

    <text x="85" y="230" fill="#22d3ee"
          font-size="10" letter-spacing="2">
      DEVELOPER ACCESS
    </text>

    <circle cx="320" cy="225" r="5"
            fill="#22c55e" class="pulse"/>

    <!-- PORTRAIT FRAME -->

    <rect x="95" y="248" width="220" height="137"
          rx="14" fill="#202038"
          stroke="#a78bfa" stroke-width="2"/>

    <image
      x="100" y="253"
      width="210" height="127"
      href="https://raw.githubusercontent.com/Srimathi-K-107/Srimathi-K-107/main/assets/character-id.png"
      preserveAspectRatio="xMidYMid slice"
      clip-path="url(#portraitClip)"/>

    <!-- PORTRAIT FRAME LIGHT -->

    <rect x="95" y="248" width="220" height="137"
          rx="14" fill="none"
          stroke="#22d3ee" stroke-width="2"
          stroke-dasharray="35 220">
      <animate attributeName="stroke-dashoffset"
               values="0;-510"
               dur="4s"
               repeatCount="indefinite"/>
    </rect>

    <!-- GOLD CHIP -->

    <rect x="95" y="398" width="36" height="26"
          rx="5" fill="url(#gold)"/>

    <path d="M107 398 V424 M119 398 V424
             M95 411 H131"
          stroke="#92400e" stroke-width="1"/>

    <!-- DETAILS -->

    <text x="145" y="407" class="heading"
          font-size="16">
      Srimathi K.
    </text>

    <text x="145" y="425" fill="#22d3ee"
          font-size="10">
      MERN STACK DEVELOPER
    </text>

    <!-- BARCODE -->

    <g fill="#e4e4e7" opacity=".8">
      <rect x="85" y="440" width="2" height="10"/>
      <rect x="90" y="440" width="4" height="10"/>
      <rect x="98" y="440" width="2" height="10"/>
      <rect x="104" y="440" width="5" height="10"/>
      <rect x="112" y="440" width="2" height="10"/>
      <rect x="118" y="440" width="3" height="10"/>
      <rect x="125" y="440" width="2" height="10"/>
    </g>

    <text x="320" y="449" text-anchor="end"
          fill="#a1a1aa" font-size="8">
      SMK / 2026
    </text>

    <!-- HOLOGRAPHIC FOIL -->

    <g clip-path="url(#foilClip)">
      <rect x="65" y="205" width="55" height="255"
            fill="url(#foil)" opacity=".3"
            class="shine"/>
    </g>

  </g>

  <!-- BADGE FOOTER -->

  <text x="220" y="492" text-anchor="middle"
        fill="#a78bfa" font-size="10"
        letter-spacing="2">
    BUILT WITH PASSION
  </text>

  <!-- RIGHT DASHBOARD -->

  <rect x="420" y="130" width="735" height="385"
        rx="20" fill="#111220"
        stroke="#22d3ee" stroke-opacity=".3"/>

  <g class="enter">

    <text x="450" y="160" fill="#22d3ee"
          font-size="11" letter-spacing="2">
      02 / GITHUB ANALYTICS
    </text>

    <text x="450" y="190" class="heading" font-size="22">
      My Progress At A Glance
    </text>

    <!-- KPI CARDS -->

    <g>

      <rect x="450" y="210" width="205" height="80"
            rx="12" fill="#1b1c30"
            stroke="#22d3ee" stroke-opacity=".4"/>

      <text x="470" y="238" class="muted" font-size="11">
        PROFILE
      </text>

      <text x="470" y="268" class="heading" font-size="25">
        2026
      </text>

      <text x="635" y="268" text-anchor="end"
            fill="#22d3ee" font-size="10">
        GRADUATE
      </text>

      <rect x="675" y="210" width="205" height="80"
            rx="12" fill="#1b1c30"
            stroke="#a78bfa" stroke-opacity=".4"/>

      <text x="695" y="238" class="muted" font-size="11">
        PRIMARY STACK
      </text>

      <text x="695" y="268" class="heading" font-size="25">
        MERN
      </text>

      <text x="860" y="268" text-anchor="end"
            fill="#a78bfa" font-size="10">
        FULL STACK
      </text>

      <rect x="900" y="210" width="225" height="80"
            rx="12" fill="#1b1c30"
            stroke="#f472b6" stroke-opacity=".4"/>

      <text x="920" y="238" class="muted" font-size="11">
        LOCATION
      </text>

      <text x="920" y="268" class="heading" font-size="22">
        ERODE
      </text>

      <text x="1105" y="268" text-anchor="end"
            fill="#f472b6" font-size="10">
        INDIA
      </text>

    </g>

    <!-- REPOSITORY CHART -->

    <rect x="450" y="310" width="415" height="180"
          rx="13" fill="#0c0e19"
          stroke="#39364f"/>

    <text x="470" y="340" class="heading" font-size="15">
      Featured Projects
    </text>

    <text x="845" y="340" text-anchor="end"
          class="muted" font-size="9">
      PROJECT OVERVIEW
    </text>

    <!-- BAR 1 -->

    <text x="470" y="373" class="muted" font-size="11">
      E-commerce App
    </text>

    <rect x="600" y="360" width="210" height="12"
          rx="6" fill="#25263a"/>

    <rect x="600" y="360" width="170" height="12"
          rx="6" fill="#22d3ee" class="bar"/>

    <text x="830" y="371" text-anchor="end"
          fill="#22d3ee" font-size="9">
      MERN
    </text>

    <!-- BAR 2 -->

    <text x="470" y="414" class="muted" font-size="11">
      Portfolio
    </text>

    <rect x="600" y="401" width="210" height="12"
          rx="6" fill="#25263a"/>

    <rect x="600" y="401" width="145" height="12"
          rx="6" fill="#a78bfa" class="bar"/>

    <text x="830" y="412" text-anchor="end"
          fill="#a78bfa" font-size="9">
      REACT
    </text>

    <!-- BAR 3 -->

    <text x="470" y="455" class="muted" font-size="11">
      AI Career Copilot
    </text>

    <rect x="600" y="442" width="210" height="12"
          rx="6" fill="#25263a"/>

    <rect x="600" y="442" width="110" height="12"
          rx="6" fill="#f472b6" class="bar"/>

    <text x="830" y="453" text-anchor="end"
          fill="#f472b6" font-size="9">
      AI + MERN
    </text>

    <text x="470" y="476" fill="#71717a" font-size="9">
      Project progress visualization · Not GitHub star counts
    </text>

    <!-- NOW PANEL -->

    <rect x="885" y="310" width="240" height="180"
          rx="13" fill="#0c0e19"
          stroke="#39364f"/>

    <text x="905" y="340" class="heading" font-size="15">
      What I'm Up To
    </text>

    <circle cx="907" cy="367" r="4"
            fill="#22c55e" class="pulse"/>

    <text x="920" y="371" fill="#86efac"
          font-size="11">
      CURRENTLY LEARNING
    </text>

    <text x="905" y="394" class="muted" font-size="12">
      AI Integration
    </text>

    <path d="M905 407 H1105"
          stroke="#333348"/>

    <circle cx="907" cy="429" r="4"
            fill="#a78bfa" class="pulse"/>

    <text x="920" y="433" fill="#c4b5fd"
          font-size="11">
      CURRENTLY BUILDING
    </text>

    <text x="905" y="456" class="muted" font-size="12">
      Full Stack Projects
    </text>

    <text x="905" y="477" fill="#71717a" font-size="9">
      ALWAYS IMPROVING
    </text>

  </g>

  <!-- FOOTER -->

  <text x="600" y="535" text-anchor="middle"
        fill="#71717a" font-size="10"
        letter-spacing="2">
    KEEP LEARNING · KEEP BUILDING · KEEP GROWING
  </text>

</svg>
