
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="540"
     viewBox="0 0 1200 540">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d1c"/>
      <stop offset="55%" stop-color="#11152c"/>
      <stop offset="100%" stop-color="#080d1c"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#202944"/>
      <stop offset="100%" stop-color="#111a30"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <style>
      .main {
        font-family: Arial, Helvetica, sans-serif;
        fill: #f8fafc;
      }
      .muted {
        font-family: Arial, Helvetica, sans-serif;
        fill: #9ca9c4;
      }
      .small {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        letter-spacing: 2px;
      }
      .card-title {
        font-family: Arial, Helvetica, sans-serif;
        fill: #f8fafc;
        font-size: 17px;
        font-weight: bold;
      }
      .card-sub {
        font-family: Arial, Helvetica, sans-serif;
        fill: #9ca9c4;
        font-size: 12px;
      }
      .float {
        animation: float 3.5s ease-in-out infinite;
      }
      .pulse {
        animation: pulse 2.5s ease-in-out infinite;
      }
      .shine {
        animation: shine 3s ease-in-out infinite;
      }
      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-9px); }
      }
      @keyframes pulse {
        0%,100% { opacity: .35; }
        50% { opacity: .9; }
      }
      @keyframes shine {
        0%,100% { opacity: .45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="540" rx="24" fill="url(#bg)"/>

  <circle cx="990" cy="150" r="150" fill="#a78bfa"
          opacity=".10" filter="url(#softGlow)"/>
  <circle cx="180" cy="400" r="130" fill="#fb7185"
          opacity=".08" filter="url(#softGlow)"/>

  <!-- Background stars -->
  <g fill="#c4b5fd" class="pulse">
    <circle cx="90" cy="95" r="2"/>
    <circle cx="340" cy="65" r="2"/>
    <circle cx="720" cy="65" r="2"/>
    <circle cx="1080" cy="90" r="2"/>
    <circle cx="1140" cy="350" r="2"/>
    <circle cx="610" cy="465" r="2"/>
    <circle cx="70" cy="300" r="2"/>
  </g>

  <!-- Header -->
  <text x="65" y="65" class="small" fill="#fb7185">
    05 / LET'S CONNECT
  </text>

  <text x="65" y="120" class="main"
        font-size="37" font-weight="bold">
    Let's Build Something
  </text>
  <text x="65" y="163" class="main"
        font-size="37" font-weight="bold" fill="#c4b5fd">
    <tspan fill="#c4b5fd">Together.</tspan>
  </text>

  <text x="67" y="202" class="muted" font-size="15">
    Have an idea, opportunity, or interesting project?
  </text>
  <text x="67" y="225" class="muted" font-size="15">
    I'd love to connect and create something meaningful.
  </text>

  <!-- Social cards -->
  <g class="float">
    <a href="https://github.com/Srimathi-K-107"
       target="_blank">
      <rect x="65" y="270" width="285" height="76" rx="15"
            fill="url(#card)" stroke="#64748b" stroke-opacity=".5"/>
      <circle cx="105" cy="308" r="22"
              fill="#ffffff" opacity=".10"/>
      <text x="105" y="315" text-anchor="middle"
            font-size="21" fill="#ffffff">GH</text>
      <text x="145" y="301" class="card-title">GitHub</text>
      <text x="145" y="323" class="card-sub">
        Explore my projects
      </text>
      <text x="320" y="315" fill="#c4b5fd"
            font-size="20">↗</text>
    </a>
  </g>

  <g class="float" style="animation-delay:.4s">
    <a href="https://www.linkedin.com/in/srimathi-mern-stack-developer/"
       target="_blank">
      <rect x="65" y="360" width="285" height="76" rx="15"
            fill="url(#card)" stroke="#64748b" stroke-opacity=".5"/>
      <circle cx="105" cy="398" r="22"
              fill="#38bdf8" opacity=".15"/>
      <text x="105" y="405" text-anchor="middle"
            font-size="20" font-weight="bold" fill="#38bdf8">in</text>
      <text x="145" y="391" class="card-title">LinkedIn</text>
      <text x="145" y="413" class="card-sub">
        Let's connect professionally
      </text>
      <text x="320" y="405" fill="#c4b5fd"
            font-size="20">↗</text>
    </a>
  </g>

  <g class="float" style="animation-delay:.8s">
    <a href="mailto:ksangeethaksrimathi@gmail.com">
      <rect x="65" y="450" width="285" height="65" rx="15"
            fill="url(#card)" stroke="#64748b" stroke-opacity=".5"/>
      <circle cx="105" cy="482" r="20"
              fill="#fb7185" opacity=".15"/>
      <text x="105" y="489" text-anchor="middle"
            font-size="19" fill="#fb7185">@</text>
      <text x="145" y="478" class="card-title">Email Me</text>
      <text x="145" y="498" class="card-sub">
        ksangeethaksrimathi@gmail.com
      </text>
    </a>
  </g>

  <!-- Decorative orbit -->
  <ellipse cx="835" cy="300" rx="260" ry="165"
           fill="none" stroke="#a78bfa"
           stroke-opacity=".22" stroke-width="1.5"
           stroke-dasharray="5 9"/>

  <ellipse cx="835" cy="300" rx="225" ry="135"
           fill="none" stroke="#fb7185"
           stroke-opacity=".16" stroke-width="1"/>

  <circle cx="600" cy="300" r="5" fill="#fb7185"
          filter="url(#glow)"/>
  <circle cx="1060" cy="300" r="5" fill="#a78bfa"
          filter="url(#glow)"/>

  <!-- Character B: replace filename with your actual image filename -->
  <image
    x="720" y="155"
    width="360" height="360"
    xlink:href="https://raw.githubusercontent.com/Srimathi-K-107/Srimathi-K-107/main/assets/character-connect.png"
    preserveAspectRatio="xMidYMax meet"/>

  <!-- Small floating label -->
  <g class="float">
    <rect x="780" y="115" width="205" height="43" rx="12"
          fill="#1c2742" stroke="#a78bfa"
          stroke-opacity=".65"/>
    <circle cx="800" cy="136" r="5" fill="#4ade80"/>
    <text x="815" y="141" class="main" font-size="13">
      Open to opportunities
    </text>
  </g>

  <!-- Bottom line -->
  <line x1="65" y1="525" x2="1135" y2="525"
        stroke="#64748b" stroke-opacity=".3"/>
</svg>
