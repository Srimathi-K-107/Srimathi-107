
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="430"
     viewBox="0 0 1200 430"
     role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#17152a"/>
    </linearGradient>

    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="portraitClip">
      <rect x="790" y="48" width="345" height="335" rx="28"/>
    </clipPath>

    <style>
      .main {
        font-family: Arial, sans-serif;
        fill: #f8fafc;
      }

      .muted {
        font-family: Arial, sans-serif;
        fill: #a1a1aa;
      }

      .enter {
        animation: reveal 1.2s ease-out both;
      }

      .pulse {
        animation: pulse 1.5s infinite;
      }

      .float {
        animation: float 4s ease-in-out infinite;
      }

      .shine {
        animation: shine 4s linear infinite;
      }

      @keyframes reveal {
        from { opacity: 0; transform: translateY(22px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pulse {
        50% { opacity: .35; }
      }

      @keyframes float {
        50% { transform: translateY(-9px); }
      }

      @keyframes shine {
        0% { transform: translateX(-180px); opacity: 0; }
        50% { opacity: .5; }
        100% { transform: translateX(180px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>

  <circle cx="960" cy="180" r="270" fill="url(#glow)"/>

  <!-- Decorative lines -->
  <path d="M0 380 Q300 320 600 390 T1200 350"
        stroke="#22d3ee" stroke-opacity=".12"
        fill="none" stroke-width="2"/>

  <rect x="24" y="24" width="1152" height="382"
        rx="22" fill="none"
        stroke="url(#aurora)" stroke-opacity=".35"/>

  <!-- Availability -->
  <g class="enter">
    <circle cx="85" cy="90" r="6" fill="#22c55e" class="pulse"/>
    <text x="103" y="95" font-size="14"
          fill="#86efac" class="main">
      OPEN TO OPPORTUNITIES
    </text>
  </g>

  <!-- Intro -->
  <g class="enter">
    <text x="75" y="160" class="muted" font-size="22">
      Hello World! I'm
    </text>

    <text x="75" y="222" class="main"
          font-size="54" font-weight="bold">
      Srimathi K.
    </text>

    <rect x="75" y="239" width="350" height="4"
          rx="2" fill="url(#aurora)"/>

    <text x="75" y="285" font-size="25"
          fill="#22d3ee" class="main">
      MERN Stack Developer
    </text>

    <text x="75" y="325" font-size="16" class="muted">
      Building responsive web applications
    </text>

    <text x="75" y="350" font-size="16" class="muted">
      and turning ideas into digital experiences.
    </text>
  </g>

  <!-- Location -->
  <g class="enter">
    <text x="75" y="385" font-size="14" fill="#a78bfa">
      ERODE, TAMIL NADU, INDIA
    </text>
  </g>

  <!-- Character -->
  <g class="float">
    <rect x="790" y="48" width="345" height="335"
          rx="28" fill="#19182b"
          stroke="url(#aurora)" stroke-width="2"/>

    <image
      x="790" y="48" width="345" height="335"
      xlink:href="https://raw.githubusercontent.com/Srimathi-K-107/Srimathi-K-107/main/assets/character-id.png"
      preserveAspectRatio="xMidYMid meet"
      clip-path="url(#portraitClip)"/>

    <rect x="790" y="48" width="345" height="335"
          rx="28" fill="none"
          stroke="#22d3ee" stroke-opacity=".35"/>

    <rect x="790" y="48" width="345" height="335"
          rx="28" fill="url(#aurora)"
          opacity="0">
      <animate attributeName="opacity"
               values="0;0.08;0"
               dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Footer label -->
  <text x="800" y="400" font-size="11"
        fill="#71717a" class="main">
    DESIGNED WITH PASSION · BUILT WITH CODE
  </text>

</svg>
