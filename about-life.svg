
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500"
     viewBox="0 0 1200 500"
     role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0e16"/>
      <stop offset="100%" stop-color="#17152a"/>
    </linearGradient>

    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191a2b"/>
      <stop offset="100%" stop-color="#10111e"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity=".07"/>
    </pattern>

    <style>
      text {
        font-family: Arial, sans-serif;
      }

      .heading {
        fill: #f8fafc;
        font-weight: bold;
      }

      .muted {
        fill: #a1a1aa;
      }

      .cyan {
        fill: #22d3ee;
      }

      .enter {
        animation: enter 1s ease-out both;
      }

      .float {
        animation: float 4s ease-in-out infinite;
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      .cursor {
        animation: blink 1s steps(2) infinite;
      }

      .progress {
        animation: progress 4s linear infinite;
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes float {
        50% {
          transform: translateY(-7px);
        }
      }

      @keyframes pulse {
        50% {
          opacity: .4;
        }
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @keyframes progress {
        from { width: 0; }
        to { width: 100%; }
      }
    </style>
  </defs>

  <!-- BACKGROUND -->

  <rect width="1200" height="500" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="26" fill="url(#dots)"/>

  <circle cx="180" cy="230" r="260" fill="url(#glow)"/>
  <circle cx="1000" cy="240" r="260" fill="url(#glow)"/>

  <rect x="20" y="20" width="1160" height="460"
        rx="22" fill="none"
        stroke="url(#aurora)" stroke-opacity=".3"/>

  <!-- SECTION TITLE -->

  <g class="enter">
    <text x="55" y="58" class="cyan"
          font-size="12" letter-spacing="4">
      GET TO KNOW ME
    </text>

    <text x="55" y="91" class="heading" font-size="27">
      Beyond The Code
    </text>

    <text x="1140" y="82" class="muted"
          font-size="12" text-anchor="end">
      MY WORLD · MY JOURNEY
    </text>
  </g>

  <!-- LEFT CARD -->

  <rect x="45" y="115" width="545" height="335"
        rx="20" fill="url(#card)"
        stroke="#a78bfa" stroke-opacity=".35"/>

  <rect x="45" y="115" width="545" height="335"
        rx="20" fill="url(#dots)"/>

  <g class="enter">

    <text x="75" y="153" class="cyan"
          font-size="11" letter-spacing="2">
      01 / WHAT I BUILD
    </text>

    <text x="75" y="184" class="heading" font-size="23">
      Turning Ideas Into Reality
    </text>

    <text x="75" y="208" class="muted" font-size="12">
      I love creating meaningful digital experiences.
    </text>

    <!-- BROWSER WINDOW -->

    <g class="float">
      <rect x="75" y="232" width="485" height="105"
            rx="12" fill="#0b0d17"
            stroke="#37304f"/>

      <path d="M75 260 H560"
            stroke="#37304f"/>

      <circle cx="93" cy="247" r="4" fill="#f472b6"/>
      <circle cx="108" cy="247" r="4" fill="#fbbf24"/>
      <circle cx="123" cy="247" r="4" fill="#22c55e"/>

      <rect x="170" y="238" width="220" height="17"
            rx="8" fill="#202034"/>

      <text x="183" y="250" fill="#a1a1aa" font-size="9">
        srimathi.dev / workspace
      </text>

      <!-- CODE LINES -->

      <text x="100" y="283" fill="#a78bfa" font-size="12">
        const
      </text>

      <text x="143" y="283" fill="#22d3ee" font-size="12">
        developer
      </text>

      <text x="210" y="283" fill="#f8fafc" font-size="12">
        = {
      </text>

      <text x="115" y="304" fill="#f472b6" font-size="11">
        passion:
      </text>

      <text x="170" y="304" fill="#86efac" font-size="11">
        "Building Web Apps"
      </text>

      <text x="115" y="321" fill="#f472b6" font-size="11">
        stack:
      </text>

      <text x="158" y="321" fill="#22d3ee" font-size="11">
        "MERN"
      </text>

      <rect x="199" y="310" width="2" height="13"
            fill="#a78bfa" class="cursor"/>

      <!-- DECORATIVE MONITOR -->

      <circle cx="480" cy="294" r="28"
              fill="#a78bfa" opacity=".12"/>

      <text x="480" y="303" text-anchor="middle"
            font-size="30" fill="#22d3ee">
        &lt;/&gt;
      </text>
    </g>

    <!-- CAPABILITIES -->

    <g>
      <rect x="75" y="357" width="145" height="65"
            rx="10" fill="#22d3ee" fill-opacity=".07"
            stroke="#22d3ee" stroke-opacity=".3"/>

      <text x="91" y="383" font-size="19" fill="#22d3ee">
        &lt;/&gt;
      </text>

      <text x="91" y="404" class="heading" font-size="11">
        Frontend
      </text>

      <rect x="232" y="357" width="145" height="65"
            rx="10" fill="#a78bfa" fill-opacity=".07"
            stroke="#a78bfa" stroke-opacity=".3"/>

      <text x="248" y="383" font-size="19" fill="#a78bfa">
        { }
      </text>

      <text x="248" y="404" class="heading" font-size="11">
        Backend
      </text>

      <rect x="389" y="357" width="171" height="65"
            rx="10" fill="#f472b6" fill-opacity=".07"
            stroke="#f472b6" stroke-opacity=".3"/>

      <text x="405" y="383" font-size="19" fill="#f472b6">
        ◈
      </text>

      <text x="405" y="404" class="heading" font-size="11">
        Database
      </text>
    </g>

  </g>

  <!-- RIGHT CARD -->

  <rect x="610" y="115" width="545" height="335"
        rx="20" fill="url(#card)"
        stroke="#22d3ee" stroke-opacity=".35"/>

  <rect x="610" y="115" width="545" height="335"
        rx="20" fill="url(#dots)"/>

  <g class="enter">

    <text x="640" y="153" class="cyan"
          font-size="11" letter-spacing="2">
      02 / LIFE OUTSIDE CODE
    </text>

    <text x="640" y="184" class="heading" font-size="23">
      My Little Happy Things
    </text>

    <text x="640" y="207" class="muted" font-size="12">
      A little passion beyond the screen.
    </text>

    <!-- HOBBY CAROUSEL BACKGROUND -->

    <rect x="640" y="225" width="485" height="135"
          rx="13" fill="#0b0d17"
          stroke="#37304f"/>

    <!-- BADMINTON SLIDE -->

    <g>
      <animate attributeName="opacity"
        values="1;1;0;0;1"
        keyTimes="0;.30;.34;.96;1"
        dur="12s" repeatCount="indefinite"/>

      <circle cx="715" cy="287" r="42"
              fill="#22d3ee" opacity=".1"/>

      <!-- Shuttlecock -->
      <path d="M695 270 L724 305 L739 293 L710 260 Z"
            fill="#22d3ee" opacity=".85"/>

      <path d="M695 270 L710 260 M724 305 L739 293"
            stroke="#e0f2fe" stroke-width="3"/>

      <circle cx="715" cy="260" r="7" fill="#f8fafc"/>

      <path d="M686 305 Q715 325 745 305"
            fill="none" stroke="#22d3ee"
            stroke-width="2" opacity=".5"/>

      <text x="780" y="270" class="heading" font-size="20">
        Badminton
      </text>

      <text x="780" y="293" class="muted" font-size="12">
        Energy, focus &amp; fun.
      </text>

      <text x="780" y="318" fill="#22d3ee" font-size="10"
            letter-spacing="2">
        ACTIVE MOMENTS
      </text>
    </g>

    <!-- CARROM SLIDE -->

    <g>
      <animate attributeName="opacity"
        values="0;0;1;1;0"
        keyTimes="0;.30;.34;.63;.67;1"
        dur="12s" repeatCount="indefinite"/>

      <circle cx="715" cy="287" r="42"
              fill="#a78bfa" opacity=".12"/>

      <rect x="678" y="250" width="74" height="74"
            rx="8" fill="#3a2a26"
            stroke="#d6a66b" stroke-width="3"/>

      <rect x="686" y="258" width="58" height="58"
            rx="3" fill="#e6c18c"/>

      <circle cx="715" cy="287" r="5" fill="#4b3026"/>
      <circle cx="703" cy="275" r="4" fill="#111827"/>
      <circle cx="727" cy="299" r="4" fill="#f8fafc"/>
      <circle cx="727" cy="275" r="4" fill="#111827"/>
      <circle cx="703" cy="299" r="4" fill="#f8fafc"/>

      <text x="780" y="270" class="heading" font-size="20">
        Carrom
      </text>

      <text x="780" y="293" class="muted" font-size="12">
        Strategy in every strike.
      </text>

      <text x="780" y="318" fill="#a78bfa" font-size="10"
            letter-spacing="2">
        GAME TIME
      </text>
    </g>

    <!-- MOVIES SLIDE -->

    <g>
      <animate attributeName="opacity"
        values="0;0;0;1;1;0"
        keyTimes="0;.30;.34;.63;.96;1"
        dur="12s" repeatCount="indefinite"/>

      <circle cx="715" cy="287" r="42"
              fill="#f472b6" opacity=".12"/>

      <rect x="682" y="257" width="66" height="53"
            rx="8" fill="#f472b6" opacity=".2"
            stroke="#f472b6" stroke-width="2"/>

      <path d="M708 271 L708 297 L731 284 Z"
            fill="#f472b6"/>

      <text x="780" y="270" class="heading" font-size="20">
        Movies
      </text>

      <text x="780" y="293" class="muted" font-size="12">
        Relax, watch &amp; recharge.
      </text>

      <text x="780" y="318" fill="#f472b6" font-size="10"
            letter-spacing="2">
        MY FREE TIME
      </text>
    </g>

    <!-- STORY PROGRESS BARS -->

    <g transform="translate(640 374)">
      <rect width="150" height="3" rx="2"
            fill="#ffffff" opacity=".15"/>
      <rect width="150" height="3" rx="2"
            fill="#22d3ee">
        <animate attributeName="width"
          values="0;150;150;0"
          keyTimes="0;.30;.34;1"
          dur="12s" repeatCount="indefinite"/>
      </rect>

      <rect x="160" width="150" height="3" rx="2"
            fill="#ffffff" opacity=".15"/>
      <rect x="160" width="150" height="3" rx="2"
            fill="#a78bfa">
        <animate attributeName="width"
          values="0;0;150;150;0"
          keyTimes="0;.30;.34;.63;1"
          dur="12s" repeatCount="indefinite"/>
      </rect>

      <rect x="320" width="165" height="3" rx="2"
            fill="#ffffff" opacity=".15"/>
      <rect x="320" width="165" height="3" rx="2"
            fill="#f472b6">
        <animate attributeName="width"
          values="0;0;0;165;165;0"
          keyTimes="0;.30;.34;.63;.96;1"
          dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- DAILY RINGS -->

    <text x="640" y="407" class="muted"
          font-size="10" letter-spacing="1">
      MY DAILY BALANCE
    </text>

    <!-- RING 1 -->

    <g transform="translate(840 415)">
      <circle r="12" fill="none"
              stroke="#25263a" stroke-width="4"/>

      <circle r="12" fill="none"
              stroke="#22d3ee" stroke-width="4"
              stroke-dasharray="75.4"
              stroke-dashoffset="25"
              transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset"
          values="75.4;25;75.4"
          dur="5s" repeatCount="indefinite"/>
      </circle>

      <text x="21" y="4" class="muted" font-size="10">
        Learn
      </text>
    </g>

    <!-- RING 2 -->

    <g transform="translate(945 415)">
      <circle r="12" fill="none"
              stroke="#25263a" stroke-width="4"/>

      <circle r="12" fill="none"
              stroke="#a78bfa" stroke-width="4"
              stroke-dasharray="75.4"
              stroke-dashoffset="32"
              transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset"
          values="75.4;32;75.4"
          dur="5s" repeatCount="indefinite"/>
      </circle>

      <text x="21" y="4" class="muted" font-size="10">
        Play
      </text>
    </g>

    <!-- RING 3 -->

    <g transform="translate(1045 415)">
      <circle r="12" fill="none"
              stroke="#25263a" stroke-width="4"/>

      <circle r="12" fill="none"
              stroke="#f472b6" stroke-width="4"
              stroke-dasharray="75.4"
              stroke-dashoffset="38"
              transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset"
          values="75.4;38;75.4"
          dur="5s" repeatCount="indefinite"/>
      </circle>

      <text x="21" y="4" class="muted" font-size="10">
        Relax
      </text>
    </g>

  </g>

  <!-- FOOTER -->

  <text x="600" y="473" text-anchor="middle"
        fill="#71717a" font-size="10"
        letter-spacing="2">
    CODE WITH PASSION · LIVE WITH PURPOSE
  </text>

</svg>
